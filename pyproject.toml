[project]
name = "booth-scanner-bot"
version = "0.1.0"
description = "Telegram bot that identifies conference booth companies and matches them against your ICP"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.0",
    "anthropic>=0.78.0",
    "tavily-python>=0.7.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
