[project]
name = "conference-scanner"
version = "0.2.0"
description = "Scrape conference exhibitor lists, enrich and score against your ICP. Telegram bot + web UI."
requires-python = ">=3.11"
dependencies = [
    # AI & Search
    "anthropic>=0.78.0",
    "tavily-python>=0.7.0",
    # Web scraping
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    # Web backend
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    # Telegram bot
    "python-telegram-bot>=22.0",
    # Database
    "aiosqlite>=0.20.0",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["core*", "api*", "bot*"]

[project.scripts]
conference-scanner = "api.main:run"
